[project]
name = "mini-lora"
version = "0.1.0"
description = "Toy LoRA retrain on SmolLM2-360M-Instruct (pirate style) - learn LoRA by doing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.8",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

# NOTE: torch (ROCm) is intentionally NOT a project dependency.
# PyPI torch wheels are CUDA/CPU-only. On this box (RX 7900 XTX, gfx1100)
# install the AMD ROCm build explicitly (pinned, reproducible):
#   ./scripts/install-rocm-torch.sh
# which is equivalent to:
#   uv pip install "torch==2.10.0+rocm7.13.0" "torchvision==0.25.0+rocm7.13.0" \
#     --index-url https://repo.amd.com/rocm/whl/gfx110X-all/ \
#     --extra-index-url https://pypi.org/simple
# See scripts/install-rocm-torch.sh and notebooks/01-pirate-lora.ipynb cell 0.
