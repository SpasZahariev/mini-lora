[project]
name = "mini-lora"
version = "0.1.0"
description = "Toy LoRA retrain on SmolLM2-360M-Instruct (pirate style) - learn LoRA by doing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib>=3.8",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "transformers>=5.18.0",
  "datasets>=5.1.0",
  "peft>=0.21.2",
  "accelerate>=1.15.0",
]

# NOTE: torch (ROCm) is intentionally NOT a project dependency.
# PyPI torch wheels are CUDA/CPU-only. On this box (RX 7900 XTX, gfx1100)
# install the AMD ROCm build explicitly (pinned, reproducible):
#   ./scripts/install-rocm-torch.sh
# Rules (read this before touching the env):
# - Re-run that script after EVERY `uv sync` / `uv add` (`accelerate`
#   drags PyPI torch into the lock and sync would otherwise revert HIP).
# - Run everything with `uv run --no-sync ...` so uv never re-syncs
#   PyPI torch over the AMD build.
# See scripts/install-rocm-torch.sh and notebooks/01-pirate-lora.ipynb cell 0.
